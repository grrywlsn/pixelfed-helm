{{- if .Values.removeRemote.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-remove-remote"
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          name: "{{ .Release.Name }}-remove-remote"
        spec:
          restartPolicy: OnFailure
          containers:
            - name: remove-remote
              image: "{{ .Values.image.repo }}:{{ .Values.image.tag }}"
              imagePullPolicy: Always
              workingDir: /var/www/html
              command:
                - php
                - artisan
                - statuses:remove-remote
                - --days={{ .Values.removeRemote.days }}
                - --batch={{ .Values.removeRemote.batch }}
                - --limit={{ .Values.removeRemote.limit }}
                - --sleep={{ .Values.removeRemote.sleep }}
                {{- if .Values.removeRemote.startId }}
                - --start-id={{ .Values.removeRemote.startId }}
                {{- end }}
                {{- if .Values.removeRemote.skipMedia }}
                - --skip-media
                {{- end }}
                {{- if .Values.removeRemote.dryRun }}
                - --dry-run
                {{- end }}
                {{- if .Values.removeRemote.force }}
                - --force
                {{- end }}
              envFrom:
                - configMapRef:
                    name: "{{ include "pixelfed.fullname" . }}"
                - secretRef:
                    name: "{{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "pixelfed.fullname" . }}{{ end }}"
  schedule: "0 3 * * 0"
  successfulJobsHistoryLimit: 3
{{- end }}
